name: docker

# Manual only: started from the Actions tab by the repository owner.
# No image is built or published on push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag (latest and the commit sha are always set)"
        required: false
        default: ""

env:
  GO_VERSION: "1.27"
  CGO_ENABLED: 0
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker-build:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the repository owner may publish images.
    if: github.actor == github.repository_owner
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure docker build context
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ inputs.tag != '' && format('{0}:{1}', env.IMAGE, inputs.tag) || '' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            "CGO_ENABLED=${{ env.CGO_ENABLED }}"
